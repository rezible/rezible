version: "0.5"
is_strict: true
ordered_shutdown: true

environment: [".env", ".env.workspace"]

processes:
  postgres-ready:
    description: Ensure the shared development PostgreSQL server is healthy
    command: just dev::ensure-infra postgres

  dex-ready:
    description: Ensure the shared Dex identity provider is healthy
    command: just dev::ensure-infra dex

  telemetry:
    description: Ensure the shared local telemetry stack is healthy
    command: just dev::ensure-infra telemetry

  alertmanager:
    description: Ensure the shared Alertmanager is healthy
    command: just dev::ensure-infra alertmanager

  backend:
    description: Run the backend development server
    command: just backend::dev
    depends_on:
      postgres-ready:
        condition: process_completed_successfully
      dex-ready:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: wget -q -O /dev/null "http://localhost:${BACKEND_PORT}/health"
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 30

  frontend:
    description: Run the frontend development server
    command: just frontend::dev
    depends_on:
      backend:
        condition: process_healthy
    readiness_probe:
      exec:
        command: wget -q -O /dev/null "http://localhost:${APP_PORT}/"
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 30

  documents-server:
    description: Run the collaborative documents development server
    command: just documents-server::dev
    depends_on:
      postgres-ready:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: wget -q -O /dev/null "http://localhost:7002/health"
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 30
