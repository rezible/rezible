global:
  resolve_timeout: 5m

route:
  receiver: rezible-dev
  group_by: ["alertname", "service", "severity"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: rezible-dev
    # The URL is written by `just dev alertmanager-target`; setup leaves a placeholder that fails delivery
    # without affecting Slack.
    webhook_configs:
      - url_file: /etc/alertmanager/rezible/webhook-url
        send_resolved: true
        max_alerts: 0
    slack_configs:
      - api_url_file: /run/secrets/slack-webhook-url
        channel: "#alerts"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
        text: |-
          {{ range .Alerts -}}
          *{{ .Labels.alertname }}* {{ .Status }}
          {{ with .Annotations.summary }}{{ . }}{{ end }}
          {{ with .Annotations.description }}{{ . }}{{ end }}
          {{ with .GeneratorURL }}{{ . }}{{ end }}
          {{ end }}
