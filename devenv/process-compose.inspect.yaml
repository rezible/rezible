version: "0.5"

processes:
  app-ports-free:
    description: Fail before inspection if an application stack is already running
    command: just dev::assert-app-ports-free

  backend:
    command: just backend::run serve
    environment:
      - "HTTP__AUTH__ENABLE_DEV_SKIP_MODE=true"
    depends_on:
      app-ports-free:
        condition: process_completed_successfully

  documents-server:
    depends_on:
      app-ports-free:
        condition: process_completed_successfully

  capture:
    description: Capture and retain the requested frontend state
    command: just frontend::capture
    availability:
      exit_on_end: true
      exit_on_skipped: true
    depends_on:
      frontend:
        condition: process_healthy
      documents-server:
        condition: process_healthy
